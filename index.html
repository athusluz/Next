<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>Next</title>

    <!-- 1. Pinta a barra do Safari comum de preto -->
    <meta name="theme-color" content="#0b0e14">
    
    <!-- 2. Faz a barra no Web App (Tela de Início) ser transparente e sobrepor a tela -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Next">
    
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/athusluz/M1thos/refs/heads/main/icone.png">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/athusluz/M1thos/refs/heads/main/icone.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            /* Cor escura idêntica ao fundo do app para eliminar qualquer borda branca */
            background-color: #0b0e14; 
        }

        /* Fixa o container preenchendo a tela física inteira sem sobrar embaixo */
        .iframe-container {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100vw;
            height: 100dvh;
            height: 100vh; /* fallback */
            z-index: 1;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <div class="iframe-container">
        <iframe src="https://script.google.com/macros/s/AKfycbwfDyr4RSInSWuFKy57zK-5Ss0Pn8aMWBAPuX_yEU4F7xIQ8lq41Ruwy-KvcNEMXi7IHg/exec" allowfullscreen></iframe>
    </div>
</body>
</html>
